[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pink-crow"
version = "0.1.0"
description = "Deterministic, offline session-risk gateway for AI chatbots & agents: cumulative OWASP-mapped risk scoring with flag/cooldown enforcement."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "dibakshya01" }]
keywords = [
  "prompt-injection", "llm-security", "ai-security", "owasp", "guardrails",
  "resource-exhaustion", "agentic-security", "agent-control-standard", "gateway",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Core is intentionally zero-dependency (standard library only).
dependencies = []

[project.urls]
Homepage = "https://github.com/dibakshya01/pink-crow"
Repository = "https://github.com/dibakshya01/pink-crow"
Issues = "https://github.com/dibakshya01/pink-crow/issues"
Documentation = "https://dibakshya01.github.io/pink-crow/"

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.27"]
yaml = ["pyyaml>=6.0"]
redis = ["redis>=5.0"]
ml = ["transformers>=4.40", "torch>=2.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
pink-crow = "pink_crow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pink_crow"]

[tool.hatch.build.targets.sdist]
# Keep heavy media out of the sdist; it is served from the repo for the site/README.
exclude = ["docs/assets/*", "/.github", "/fixtures/benign/large_*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter; prose in docstrings may exceed

[tool.mypy]
# mypy's own analysis floor is 3.10; the package still targets 3.9 at runtime (enforced by the CI
# test matrix + `from __future__ import annotations` in every module, so PEP 585/604 annotations are
# never evaluated on 3.9).
python_version = "3.10"
packages = ["pink_crow"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
