name: Publish to PyPI

# Tokenless publishing via PyPI Trusted Publishing (OIDC).
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project: pink-crow
#   Owner:        dibakshya01
#   Repository:   pink-crow
#   Workflow:     publish.yml
#   Environment:  pypi
# After that, this runs on every GitHub Release (or manual dispatch) with NO token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build sdist + wheel and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pink-crow
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
